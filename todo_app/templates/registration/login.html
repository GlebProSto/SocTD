{% extends 'base.html' %} {% load static %} {% block content %}
<div class="auth-form">
  <h2>Вход в систему</h2>

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Имя пользователя:</label>
      <input type="text" name="username" id="username" required class="form-input" />
    </div>

    <div class="form-group">
      <label for="password">Пароль:</label>
      <input type="password" name="password" id="password" required class="form-input" />
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%">Войти</button>
  </form>

  <div class="form-links">
    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}

<!-- 1. name="password" (Самый важный)
Задача: Это имя поля, под которым данные будут отправлены на сервер.

Как работает: Когда вы нажимаете "Войти", браузер формирует запрос с данными формы. Сервер (Django в вашем случае) получит данные в виде словаря, примерно так:

python
request.POST = {
    'username': 'ваш_логин',
    'password': 'ваш_пароль',  # ← Значение этого поля!
    'csrfmiddlewaretoken': '...'
}
В вашем коде: Строка password = request.POST['password'] как раз ищет значение по ключу 'password'. Если бы name был другим (например, user_password), то эта строка кода сломалась бы, так как пыталась бы получить несуществующий ключ 'password'.

2. id="password" (для связи и стилей)
Задача: Уникально идентифицирует этот конкретный элемент HTML на странице.

Как работает:

Связь с <label>: Атрибут for="password" у тега <label> говорит браузеру: "эта текстовая метка относится к элементу с id="password". Это улучшает usability — если пользователь кликнет на саму надпись "Пароль", курсор автоматически перейдет в это поле ввода.

CSS и JavaScript: По этому id можно обратиться к полю из стилей (#password { ... }) или скриптов, чтобы изменить его внешний вид или поведение.

3. for="password" (в теге <label>)
Задача: Указать, к какому элементу формы относится данная текстовая метка.

Как работает: Как уже было сказано, значение for должно совпадать со значением id у соответствующего поля ввода <input>. Это создает программную связь между ними. -->


<!-- Метод	Куда данные	Для чего использовать	Пример
post	В теле запроса	Логины, пароли, платежи, формы обратной связи. Любые действия, изменяющие состояние системы.	<form method="post"> (Ваш правильный вариант)
get	В URL-адресе	Поиск, фильтрация, сортировка. Получение данных без их изменения.	<form method="get"> или просто <form> -->
