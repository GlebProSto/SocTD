{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-form">
    <h2>Регистрация</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
            <div class="error-message">
                {{ field.errors }}
            </div>
            {% endif %}
        </div>
        {% endfor %}
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Зарегистрироваться
        </button>
    </form>
    
    <div class="form-links">
        <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</div>
{% endblock %}
